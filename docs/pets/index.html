</style>

    4:    { emoji: '🐱', name: 'Cat',     rarity: 'common',    color: '#9e9e9e' },

    16:   { emoji: '🐺', name: 'Wolf',    rarity: 'rare',      color: '#4fc3f7' },
    32:   { emoji: '🐻', name: 'Bear',    rarity: 'rare',      color: '#4fc3f7' },
    64:   { emoji: '🦅', name: 'Eagle',   rarity: 'rare',      color: '#4fc3f7' },
    128:  { emoji: '🦈', name: 'Shark',   rarity: 'epic',      color: '#ce93d8' },
    256:  { emoji: '🐯', name: 'Tiger',   rarity: 'epic',      color: '#ce93d8' },
    512:  { emoji: '🐊', name: 'Croco',   rarity: 'epic',      color: '#ce93d8' },

// ==================== GAME STATE ====================
const GRID_SIZE = 4;
let grid = [];
let nextTileId = 1;
let undoState = null;
let score = 0;
let best = 0;
let gameOver = false;
let won = false;
let continuedAfterWin = false;
let discovered = {}; // {value: true} for pet values discovered
let lastScore = 0; // previous score, for +N float animation
let isProcessing = false; // anti-spam flag during animation

// ==================== DOM REFS ====================
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const collectionCountEl = document.getElementById('collection-count');
let tileElements = new Map();
let gridBackgroundBuilt = false;
let layoutCache = { gap: 0, cellSize: 0, boardWidth: 0 };

// ==================== HELPERS ====================
function updateLayoutCache() {
    const boardRect = boardEl.getBoundingClientRect();
    if (boardRect.width === layoutCache.boardWidth) return;
    layoutCache.boardWidth = boardRect.width;
    layoutCache.gap = boardRect.width * 0.02;
    layoutCache.cellSize = (boardRect.width - layoutCache.gap * (GRID_SIZE + 1)) / GRID_SIZE;
}
function getTilePosition(r, c) {
    const { gap, cellSize } = layoutCache;
    return { left: gap + c * (cellSize + gap), top: gap + r * (cellSize + gap) };
}
function formatScore(s) {
    if (s < 1000) return String(s);
    if (s < 1000000) return (s/1000).toFixed(1).replace(/\.0$/,'')+'k';
    return (s/1000000).toFixed(1).replace(/\.0$/,'')+'m';
}
function showScoreIncrease(increase) {
    if (increase <= 0) return;
    const floatEl = document.createElement('div');
    floatEl.className = 'score-increase';
    floatEl.textContent = `+${increase}`;
    const scoreRect = scoreEl.getBoundingClientRect();
    const appRect = document.getElementById('app').getBoundingClientRect();
    floatEl.style.left = (scoreRect.left - appRect.left + scoreRect.width/2) + 'px';
    floatEl.style.top = (scoreRect.top - appRect.top) + 'px';
    floatEl.style.fontSize = '24px';
    document.getElementById('app').appendChild(floatEl);
    setTimeout(()=>floatEl.remove(), 800);
}

// ==================== COLLECTION ====================
function discoverPet(value) {
    if (!PETS[value] || discovered[value]) return false;
    discovered[value] = true;
    updateCollectionCount();
    return true;
}
function updateCollectionCount() {
    const count = Object.keys(discovered).length;
    collectionCountEl.textContent = count + '/' + Object.keys(PETS).length;
}
function renderCollection() {
    const grid = document.getElementById('collection-grid');
    const stats = document.getElementById('collection-stats');
    const count = Object.keys(discovered).length;
    const total = Object.keys(PETS).length;
    stats.textContent = `${T.discovered} ${count}/${total}`;
    
    grid.innerHTML = '';
    const values = Object.keys(PETS).map(Number).sort((a,b)=>a-b);
    for (const v of values) {
        const p = PETS[v];
        const card = document.createElement('div');
        card.className = 'collection-card ' + (discovered[v] ? 'owned' : 'unknown');
        card.setAttribute('data-rarity', p.rarity);
        card.innerHTML = `
            <div class="card-emoji">${discovered[v] ? p.emoji : '❓'}</div>
            <div class="card-name">${discovered[v] ? petName(v) : '???'}</div>
            <div class="card-rarity">${discovered[v] ? rarityName(p.rarity) : '???'}</div>
        `;
        grid.appendChild(card);
    }
}

// ==================== BOARD LOGIC ====================
function initGrid() {
    grid = Array.from({length:GRID_SIZE}, ()=>Array(GRID_SIZE).fill(null));
    nextTileId = 1;
    undoState = null;
}
function spawnTile() {
    const empty = [];
    for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) if (!grid[r][c]) empty.push({r,c});
    if (!empty.length) return null;
    const {r,c} = empty[Math.floor(Math.random()*empty.length)];
    const value = Math.random()<0.9 ? 2 : 4;
    const id = nextTileId++;
    grid[r][c] = {id, value};
    discoverPet(value); // 静默记录 spawn 的宠物（Slime/Cat），否则 Slime(2) 永远"未发现"（它只能 spawn，不能合并产生）
    return {id, value, r, c};
}
function moveGrid(direction) {
    const newGrid = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(null));
    const allMoves = [], allMerges = [];
    let anyMoved = false;
    const vertical = (direction==='up'||direction==='down');
    const isReverse = (direction==='right'||direction==='down');

    for (let lineIdx = 0; lineIdx < GRID_SIZE; lineIdx++) {
        // 提取一条线（行或列），元素带原始坐标
        let line = [];
        for (let k = 0; k < GRID_SIZE; k++) {
            const r = vertical ? k : lineIdx;
            const c = vertical ? lineIdx : k;
            const cell = grid[r][c];
            if (cell) line.push({id:cell.id, value:cell.value, r, c});
        }
        // right/down：反向，使"向左压紧合并"等价于"向右/向下"
        if (isReverse) line.reverse();

        const result = [];
        let j = 0;
        while (j < line.length) {
            if (j < line.length - 1 && line[j].value === line[j+1].value) {
                const nv = line[j].value * 2;
                score += nv;
                const targetIdx = result.length;
                const finalIdx = isReverse ? (GRID_SIZE - 1 - targetIdx) : targetIdx;
                const toR = vertical ? finalIdx : lineIdx;
                const toC = vertical ? lineIdx : finalIdx;
                allMoves.push({id:line[j].id, fromRow:line[j].r, fromCol:line[j].c, toRow:toR, toCol:toC, merge:true});
                allMoves.push({id:line[j+1].id, fromRow:line[j+1].r, fromCol:line[j+1].c, toRow:toR, toCol:toC, merge:true, disappear:true});
                result.push({id:line[j].id, value:nv});
                allMerges.push({id:line[j].id, row:toR, col:toC, value:nv});
                j += 2;
            } else {
                const targetIdx = result.length;
                const finalIdx = isReverse ? (GRID_SIZE - 1 - targetIdx) : targetIdx;
                const toR = vertical ? finalIdx : lineIdx;
                const toC = vertical ? lineIdx : finalIdx;
                allMoves.push({id:line[j].id, fromRow:line[j].r, fromCol:line[j].c, toRow:toR, toCol:toC, merge:false});
                result.push({id:line[j].id, value:line[j].value});
                j++;
            }
        }

        for (let m = 0; m < result.length; m++) {
            const finalIdx = isReverse ? (GRID_SIZE - 1 - m) : m;
            const r = vertical ? finalIdx : lineIdx;
            const c = vertical ? lineIdx : finalIdx;
            newGrid[r][c] = {id:result[m].id, value:result[m].value};
        }
    }

    for (const mv of allMoves) {
        if (mv.fromRow !== mv.toRow || mv.fromCol !== mv.toCol || mv.merge) { anyMoved = true; break; }
    }

    if (!anyMoved) return null;
    grid = newGrid;
    return {moves:allMoves, merges:allMerges};
}
function canMove() {
    for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) {
        if (!grid[r][c]) return true;
        if (c<GRID_SIZE-1 && grid[r][c+1] && grid[r][c].value===grid[r][c+1].value) return true;
        if (r<GRID_SIZE-1 && grid[r+1][c] && grid[r][c].value===grid[r+1][c].value) return true;
    }
    return false;
}
function checkWin() {
    for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) if (grid[r][c] && grid[r][c].value>=2048) return true;
    return false;
}

// ==================== SPARKLE PARTICLES ====================
function spawnSparkles(x, y, count) {
    const colors = ['#ffd54f','#ff80ab','#4fc3f7','#ce93d8','#69f0ae','#fff'];
    for (let i=0;i<count;i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        const size = 4+Math.random()*8;
        const angle = Math.random()*Math.PI*2;
        const dist = 20+Math.random()*30;
        el.style.cssText = `
            left:${x}px;top:${y}px;
            width:${size}px;height:${size}px;
            background:${colors[Math.floor(Math.random()*colors.length)]};
            border-radius:50%;
            --sx:${Math.cos(angle)*dist}px;
            --sy:${Math.sin(angle)*dist}px;
        `;
        boardEl.appendChild(el);
        setTimeout(()=>el.remove(), 600);
    }
}

// ==================== UI RENDERING ====================
function buildGridBackground() {
    if (gridBackgroundBuilt) return;
    updateLayoutCache();
    const {gap, cellSize} = layoutCache;
    boardEl.querySelectorAll('.grid-cell').forEach(c=>c.remove());
    for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.style.cssText = `left:${gap+c*(cellSize+gap)}px;top:${gap+r*(cellSize+gap)}px;width:${cellSize}px;height:${cellSize}px`;
        boardEl.appendChild(cell);
    }
    gridBackgroundBuilt = true;
}
function setTilePos(tile, left, top, cellSize) {
    // 同时设置 transform 和 transform-origin，确保 scale 动画围绕视觉中心膨胀
    tile.style.transform = `translate(${left}px,${top}px)`;
    tile.style.transformOrigin = `${left + cellSize/2}px ${top + cellSize/2}px`;
}
function createTileElement(id, value, r, c) {
    updateLayoutCache();
    const {cellSize} = layoutCache;
    const pos = getTilePosition(r,c);
    const pet = PETS[value] || {emoji:'❓',name:'?',rarity:'common',color:'#9e9e9e'};
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = id;
    tile.setAttribute('data-rarity', pet.rarity);
    tile.style.cssText = `width:${cellSize}px;height:${cellSize}px`;
    setTilePos(tile, pos.left, pos.top, cellSize);
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    const emojiSize = cellSize * 0.35;
    const nameSize = cellSize * 0.13;
    inner.innerHTML = `
        <span class="tile-emoji" style="font-size:${emojiSize}px">${pet.emoji}</span>
        <span class="tile-name" style="font-size:${nameSize}px">${petName(value)}</span>
        <span class="tile-value" style="font-size:${cellSize*0.14}px">${value}</span>
    `;
    tile.appendChild(inner);
    return tile;
}
function updateTileContent(tile, value) {
    const pet = PETS[value] || {emoji:'❓',name:'?',rarity:'common'};
    tile.setAttribute('data-rarity', pet.rarity);
    const inner = tile.querySelector('.tile-inner');
    if (inner) {
        updateLayoutCache();
        const cellSize = layoutCache.cellSize;
        inner.innerHTML = `
            <span class="tile-emoji" style="font-size:${cellSize*0.35}px">${pet.emoji}</span>
            <span class="tile-name" style="font-size:${cellSize*0.13}px">${petName(value)}</span>
            <span class="tile-value" style="font-size:${cellSize*0.14}px">${value}</span>
        `;
    }
}
function render() {
    scoreEl.textContent = formatScore(score);
    bestEl.textContent = formatScore(best);
    buildGridBackground();
    const currentIds = new Set();
    const updates = [];
    const creates = [];
    for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) {
        const cell = grid[r][c];
        if (!cell) continue;
        currentIds.add(cell.id);
        if (tileElements.has(cell.id)) {
            updates.push({id:cell.id, value:cell.value, r, c});
        } else {
            creates.push({id:cell.id, value:cell.value, r, c});
        }
    }
    const toRemove = [];
    for (const [id] of tileElements) if (!currentIds.has(id)) toRemove.push(id);
    requestAnimationFrame(()=>{
        for (const id of toRemove) { tileElements.get(id).remove(); tileElements.delete(id); }
        // 现有 tile：只更新位置和内容，不触发膨胀动画（undo 后平滑移动，对齐原版）
        for (const {id, value, r, c} of updates) {
            const tile = tileElements.get(id);
            const pos = getTilePosition(r, c);
            setTilePos(tile, pos.left, pos.top, layoutCache.cellSize);
            updateTileContent(tile, value);
        }
        for (const {id,value,r,c} of creates) {
            const tile = createTileElement(id,value,r,c);
            boardEl.appendChild(tile);
            tileElements.set(id, tile);
            requestAnimationFrame(()=>tile.classList.add('tile-new'));
        }
    });
}
function renderWithAnimation(moveInfo, newTile, onDone) {
    if (score > lastScore) showScoreIncrease(score - lastScore);
    lastScore = score;
    scoreEl.textContent = formatScore(score);
    bestEl.textContent = formatScore(best);
    buildGridBackground();
    const {moves, merges} = moveInfo;
    for (const move of moves) {
        const tile = tileElements.get(move.id);
        if (!tile) continue;
        const pos = getTilePosition(move.toRow, move.toCol);
        setTilePos(tile, pos.left, pos.top, layoutCache.cellSize);
    }
    setTimeout(()=>{
        for (const merge of merges) {
            const mergeMoves = moves.filter(m=>m.toRow===merge.row&&m.toCol===merge.col&&m.merge);
            if (mergeMoves.length>=2) {
                const firstTile = tileElements.get(mergeMoves[0].id);
                if (firstTile) {
                    const pet = PETS[merge.value] || {emoji:'❓',name:'?',rarity:'common'};
                    firstTile.setAttribute('data-rarity', pet.rarity);
                    const inner = firstTile.querySelector('.tile-inner');
                    if (inner) {
                        updateLayoutCache();
                        const cellSize = layoutCache.cellSize;
                        inner.innerHTML = `
                            <span class="tile-emoji" style="font-size:${cellSize*0.35}px">${pet.emoji}</span>
                            <span class="tile-name" style="font-size:${cellSize*0.13}px">${petName(merge.value)}</span>
                            <span class="tile-value" style="font-size:${cellSize*0.14}px">${merge.value}</span>
                        `;
                    }
                    firstTile.classList.add('tile-merged');
                    // Sparkles at merge position
                    const pos = getTilePosition(merge.row, merge.col);
                    const boardRect = boardEl.getBoundingClientRect();
                    spawnSparkles(pos.left + layoutCache.cellSize/2, pos.top + layoutCache.cellSize/2, 12);
                    // Discovery check
                    if (discoverPet(merge.value)) {
                        setTimeout(()=>{
                            const pet2 = PETS[merge.value];
                            const toast = document.createElement('div');
                            toast.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;z-index:300;font-size:0.9em;animation:scoreFly 2s ease-out forwards`;
                            toast.textContent = `${T.toastPrefix} ${pet2.emoji} ${petName(merge.value)}!`;
                            document.body.appendChild(toast);
                            setTimeout(()=>toast.remove(), 2100);
                            updateCollectionCount();
                        }, 400);
                    }
                    // Ultimate pet (Unicorn = 4096) unlock celebration — 直接展示卡片
                    if (merge.value >= 4096) {
                        setTimeout(()=>{ showUnicornCard(); }, 600);
                    }
                }
                const secondTile = tileElements.get(mergeMoves[1].id);
                if (secondTile) secondTile.remove();
                tileElements.delete(mergeMoves[1].id);
            }
        }
        if (newTile && !tileElements.has(newTile.id)) {
            const tile = createTileElement(newTile.id, newTile.value, newTile.r, newTile.c);
            boardEl.appendChild(tile);
            tileElements.set(newTile.id, tile);
            requestAnimationFrame(()=>tile.classList.add('tile-new'));
        }
        setTimeout(()=>{
            for (const t of tileElements.values()) t.classList.remove('tile-new','tile-merged');
            if (onDone) onDone();
        }, 350);
    }, 120);
}

// ==================== GAME FLOW ====================
function restoreUndo() {
    if (!undoState) return false;
    grid = undoState.grid;
    score = undoState.score;
    gameOver = undoState.gameOver;
    won = undoState.won;
    nextTileId = undoState.nextTileId;
    undoState = null;
    lastScore = score;
    render(); // render 的 updates 分支处理现有 tile 的平滑移动，creates 分支处理恢复的 tile
    return true;
}
function saveBest() {
    if (score>best) { best=score; localStorage.setItem('petmerge_best',best); }
}
function undoMove() {
    // 撤销一步（含 game over 后挽回：隐藏 game-over 弹窗）
    if (restoreUndo()) {
        saveBest();
        hideOverlay('game-over');
        saveGameState();
        updateUndoButton();
        return true;
    }
    return false;
}
function saveGameState() {
    const state = {
        grid: grid.map(r=>r.map(c=>c?{...c}:null)),
        score, best, gameOver, won, continuedAfterWin, nextTileId, discovered,
        undoState: undoState ? {
            grid: undoState.grid.map(r=>r.map(c=>c?{...c}:null)),
            score: undoState.score, nextTileId: undoState.nextTileId,
            gameOver: undoState.gameOver, won: undoState.won
        } : null
    };
    localStorage.setItem('petmerge_state', JSON.stringify(state));
}
function loadGameState() {
    const saved = localStorage.getItem('petmerge_state');
    if (!saved) return false;
    try {
        const s = JSON.parse(saved);
        grid = s.grid.map(r=>r.map(c=>c?{...c}:null));
        score = s.score; best = s.best; gameOver = s.gameOver;
        won = s.won; continuedAfterWin = s.continuedAfterWin;
        nextTileId = s.nextTileId; discovered = s.discovered || {};
        undoState = s.undoState ? {
            grid: s.undoState.grid.map(r=>r.map(c=>c?{...c}:null)),
            score: s.undoState.score, nextTileId: s.undoState.nextTileId,
            gameOver: s.undoState.gameOver, won: s.undoState.won
        } : null;
        // 空棋盘守卫：存档 grid 全空时视为无效，避免渲染空白棋盘
        const hasTiles = grid.some(row => row.some(c => c !== null));
        if (!hasTiles) return false;
        return true;
    } catch(e) { return false; }
}
function updateUndoButton() {
    const btn = document.getElementById('undo-btn');
    if (btn) btn.disabled = !undoState;
}
function startGame() {
    initGrid();
    score=0; gameOver=false; won=false; continuedAfterWin=false;
    lastScore = 0;
    if (!best) { const s=localStorage.getItem('petmerge_best'); best=s?parseInt(s):0; }
    tileElements.forEach(t=>t.remove());
    tileElements.clear();
    spawnTile(); spawnTile();
    render();
    saveBest();
    saveGameState();
    updateUndoButton();
}
function handleMove(direction) {
    if (isProcessing || gameOver) return;
    // 记录 move 前状态（深拷贝），仅在 move 有效时才写入 undoState
    const oldGrid = grid.map(r=>r.map(c=>c?{...c}:null));
    const oldScore = score;
    const oldNextId = nextTileId;
    const oldGameOver = gameOver;
    const oldWon = won;
    const moveInfo = moveGrid(direction);
    if (!moveInfo) return; // 无效移动：不碰 undoState，保留上一步的撤销能力
    undoState = { grid: oldGrid, score: oldScore, nextTileId: oldNextId, gameOver: oldGameOver, won: oldWon };
    isProcessing = true;
    const newTile = spawnTile();
    renderWithAnimation(moveInfo, newTile, ()=>{
        isProcessing = false;
        saveBest();
        updateCollectionCount();
        saveGameState();
        updateUndoButton();
        if (!canMove() && !gameOver) {
            gameOver=true;
            saveGameState();
            setTimeout(()=>{
                document.getElementById('final-score').textContent = formatScore(score);
                document.getElementById('final-pets').textContent = Object.keys(discovered).length;
                document.getElementById('game-over').classList.remove('hidden');
            }, 400);
        }
        if (!won && checkWin()) {
            won=true;
            saveGameState();
            setTimeout(()=>{
                document.getElementById('win-score').textContent = formatScore(score);
                document.getElementById('win-message').classList.remove('hidden');
            }, 400);
        }
    });
}
function keepPlaying() {
    hideOverlay('win-message');
    continuedAfterWin = true;
    saveGameState();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    // 优先按单词换行（英文），超长词/无空格中文按字符拆
    const words = text.split(' ');
    let line = '';
    for (const word of words) {
        if (ctx.measureText(word).width > maxWidth) {
            // 超长词（如整句中文）按字符拆
            if (line) { ctx.fillText(line.trim(), x, y); y += lineHeight; line = ''; }
            let sub = '';
            for (const ch of word) {
                if (ctx.measureText(sub + ch).width > maxWidth) {
                    ctx.fillText(sub, x, y); y += lineHeight; sub = ch;
                } else { sub += ch; }
            }
            line = sub;
        } else {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxWidth) {
                ctx.fillText(line, x, y); y += lineHeight; line = word;
            } else { line = test; }
        }
    }
    if (line) ctx.fillText(line, x, y);
    return y;
}
function renderUnicornCard() {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350;
    const ctx = canvas.getContext('2d');

    // 渐变背景
    const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
    grad.addColorStop(0, '#f3e5f5');
    grad.addColorStop(1, '#e1f5fe');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1350);

    // 内层卡片面板 + 金色边框（mythic 稀有度）
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(60, 60, 960, 1230);
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 10;
    ctx.strokeRect(60, 60, 960, 1230);

    // 游戏名
    ctx.fillStyle = '#776e65';
    ctx.font = 'bold 76px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Unicorn Merge', 540, 200);

    // 独角兽 emoji（大图）
    ctx.font = '380px Arial, sans-serif';
    ctx.fillText('🦄', 540, 620);

    // 成就标题（去掉 emoji，因为上面已有大 🦄）
    ctx.fillStyle = '#8e7a66';
    ctx.font = 'bold 60px Arial, sans-serif';
    ctx.fillText(T.unicornTitle.replace(/^🦄\s*/, ''), 540, 880);

    // 成就描述（自动换行，避免溢出）
    ctx.font = '44px Arial, sans-serif';
    wrapText(ctx, T.unicornDesc, 540, 960, 880, 58);

    // 网站
    ctx.fillStyle = '#776e65';
    ctx.font = 'bold 54px Arial, sans-serif';
    ctx.fillText('live2048.com', 540, 1120);

    // 日期 + 分数
    const dateStr = new Date().toISOString().slice(0, 10);
    ctx.fillStyle = '#9e9488';
    ctx.font = '38px Arial, sans-serif';
    ctx.fillText(dateStr + '  ·  Score ' + score, 540, 1200);

    return canvas;
}
function downloadUnicornCard() {
    const link = document.createElement('a');
    link.download = 'unicorn-merge.png';
    link.href = renderUnicornCard().toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
function showUnicornCard() {
    const img = document.getElementById('unicorn-card-img');
    if (img) img.src = renderUnicornCard().toDataURL('image/png');
    document.getElementById('unicorn-message').classList.remove('hidden');
}
function confirmNewGame(callback) {
    if (score > 0 && !gameOver) {
        if (!confirm(T.confirmNewGame)) return;
    }
    callback();
}

// ==================== OVERLAY ====================
function hideOverlay(id) { document.getElementById(id).classList.add('hidden'); }
function isOverlayOpen() {
    return !document.getElementById('collection-overlay').classList.contains('hidden')
        || !document.getElementById('win-message').classList.contains('hidden')
        || !document.getElementById('unicorn-message').classList.contains('hidden');
}

// 窗口尺寸变化时重算棋盘布局（原版有，重写时曾遗漏）
let resizeTimer;
window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
        gridBackgroundBuilt = false;
        layoutCache.boardWidth = 0;
        tileElements.clear();
        boardEl.querySelectorAll('.tile').forEach(tile=>tile.remove());
        render();
    }, 150);
});

// ==================== INPUT ====================
document.addEventListener('keydown', e=>{
    const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
    if (map[e.key]) {
        if (isOverlayOpen()) return; // overlay 打开时不响应棋盘输入
        e.preventDefault(); handleMove(map[e.key]);
    }
});
let touchStartX=0, touchStartY=0;
document.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
// 阻止棋盘区域的触摸被浏览器解释为滚动/缩放（兜底，配合 CSS touch-action:none）
document.addEventListener('touchmove', e=>{
    const t = e.target;
    if (t && t.closest && t.closest('#board-container')) e.preventDefault();
}, {passive:false});
document.addEventListener('touchend', e=>{
    if (isOverlayOpen()) return; // overlay 打开时不响应棋盘输入
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if (Math.abs(dx)<30 && Math.abs(dy)<30) return;
    handleMove(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
});

// ==================== BUTTONS ====================
document.getElementById('restart-btn').addEventListener('click', (e)=>{ e.currentTarget.blur(); confirmNewGame(()=>{ startGame(); }); });
document.getElementById('undo-btn').addEventListener('click', (e)=>{
    e.currentTarget.blur();
    undoMove();
});
document.getElementById('collection-btn').addEventListener('click', (e)=>{
    e.currentTarget.blur();
    renderCollection();
    document.getElementById('collection-overlay').classList.remove('hidden');
});

// ==================== START ====================
// 设备检测：触摸设备显示滑动提示，桌面显示键盘提示
(function(){
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const hint = document.querySelector('.game-hint');
    if (hint) hint.textContent = isTouch ? T.hintTouch : T.hintKeys;
})();
function initGame() {
    if (loadGameState()) {
        tileElements.forEach(t=>t.remove());
        tileElements.clear();
        render();
        updateCollectionCount();
        updateUndoButton();
        if (gameOver) document.getElementById('game-over').classList.remove('hidden');
        if (won && !continuedAfterWin) document.getElementById('win-message').classList.remove('hidden');
    } else {
        startGame();
    }
}
// 测试模式：?test=unicorn 注入两个相邻 2048（快速测试合成独角兽）
(function(){
    const test = new URLSearchParams(location.search).get('test');
    if (test === 'unicorn') {
        localStorage.setItem('petmerge_state', JSON.stringify({
            grid: [[{id:1,value:2048},{id:2,value:2048},null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]],
            score: 20000, best: 20000, gameOver: false, won: true, continuedAfterWin: true,
            nextTileId: 3,
            discovered: {2:1,4:1,8:1,16:1,32:1,64:1,128:1,256:1,512:1,1024:1,2048:1},
            undoState: null
        }));
    }
})();
initGame();
</script>
