<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Your IP</title>
<style>body{font:28px monospace;padding:2rem;text-align:center;margin-top:15vh;background:#faf8ef;color:#776e65}</style>
</head><body>
<div id="r">Detecting...</div>
<script>
// Try services that work inside China first
const services = [
  'https://api.ip.sb/geoip',           // works in China
  'https://ipapi.co/json/',            // global fallback
  'https://api.ipify.org?format=json', // last resort
];
async function tryAll() {
  for (const url of services) {
    try {
      const r = await fetch(url);
      const t = await r.json();
      document.getElementById('r').textContent = t.ip || t.query || 'no ip';
      return;
    } catch(e) {}
  }
  document.getElementById('r').textContent = 'Failed. Try wifi.';
}
tryAll();
</script>
</body></html>
